<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Philosophical Question ✨🤝</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* خلفية صورة كاملة للشاشة */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://picsum.photos/id/1015/1920/1080') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 440px;
            width: 85%;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #2b2d42;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 60px;
            position: relative;
        }

        .btn {
            padding: 12px 28px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #e63946;
            color: white;
            z-index: 2;
        }

        #noBtn {
            background-color: #a8dadc;
            color: #1d3557;
            z-index: 10;
        }

        .success-content {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="card" id="mainCard">
        <h1 id="questionText">
            Midst all this quiet and passing routine, could a single conversation create a new wave? 🌊☕<br><br>
            <strong>Could we be a lovely routine in each other's lives as good friends? 🤝✨👯‍♀️</strong>
        </h1>

        <div class="btn-group">
            <button class="btn" id="yesBtn">Yes, absolutely! 💛🌱</button>
            <button class="btn" id="noBtn">No 😅</button>
        </div>
    </div>

    <!-- Success Screen -->
    <div class="card success-content" id="successCard">
        <h1 style="color: #e63946;">The start of a wonderful friendship routine! 🎉💛</h1>
        <p style="color: #444; margin-bottom: 25px; font-size: 15px; font-weight: 500;">Let's start our first friendly chat and break the routine... ☕💬</p>
        
        <a id="whatsappLink" href="https://wa.me/201100924135" style="text-decoration: none;">
            <button class="btn" style="background-color: #25D366; color: white;">Chat on WhatsApp 💬✨</button>
        </a>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainCard = document.getElementById('mainCard');
        const successCard = document.getElementById('successCard');

        let scale = 1;

        function moveButton() {
            noBtn.style.position = 'fixed';
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            scale += 0.2;
            yesBtn.style.transform = `scale(${scale})`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        yesBtn.addEventListener('click', () => {
            mainCard.style.display = 'none';
            successCard.style.display = 'block';
        });
    </script>
</body>
</html>
